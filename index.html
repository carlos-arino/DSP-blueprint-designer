<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSP Blueprint Designer</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="topbar">
  <div class="brand">DSP Blueprint Designer</div>
  <div class="group">
    <button id="btnNew" title="Nuevo blueprint">Nuevo</button>
    <button id="btnOpenFile" title="Abrir un archivo .txt">Abrir…</button>
    <button id="btnOpenDir" title="Abrir la carpeta de blueprints del juego">Abrir carpeta</button>
    <button id="btnPaste" title="Pegar un código BLUEPRINT:…">Pegar código</button>
  </div>
  <div class="group">
    <button id="btnUndo" title="Deshacer (Ctrl+Z)">↶</button>
    <button id="btnRedo" title="Rehacer (Ctrl+Y)">↷</button>
  </div>
  <div class="group">
    <button id="btnCopy" class="primary" title="Copiar el código al portapapeles para pegarlo en el juego">Copiar código</button>
    <button id="btnSave" title="Guardar (Ctrl+S)">Guardar</button>
    <button id="btnSaveAs" title="Guardar con otro nombre">Guardar como…</button>
    <button id="btnDownload" title="Descargar como .txt">Descargar</button>
  </div>
  <div id="docTitle" class="doc-title"></div>
</header>

<main>
  <aside id="left">
    <section id="librarySection" class="panel">
      <h3>Biblioteca <span id="libPath" class="muted"></span></h3>
      <div id="library" class="list"><p class="muted small">Abre la carpeta de blueprints del juego (Documentos\Dyson Sphere Program\Blueprint) para verlos aquí.</p></div>
    </section>
    <section class="panel grow">
      <h3>Edificios</h3>
      <input id="paletteSearch" type="search" placeholder="Buscar…">
      <div id="palette" class="list"></div>
    </section>
  </aside>

  <section id="center">
    <div id="toolbar">
      <button data-tool="select" class="tool active" title="Seleccionar / mover (V)">⬚ Seleccionar</button>
      <button id="btnRotate" title="Girar selección 90° (R)">⟳ Girar</button>
      <button id="btnDup" title="Duplicar (Ctrl+D)">⧉ Duplicar</button>
      <button id="btnDelete" title="Borrar (Supr)">🗑 Borrar</button>
      <button id="btnFit" title="Encuadrar (F)">⤢ Encuadrar</button>
      <button id="btnCleanSorters" title="Borrar los clasificadores a los que les falta el inicio o el fin">🧹 Limpiar</button>
      <label class="chk" title="Nivel de altura: las cintas nuevas se ponen a este nivel y el resto se atenúa (RePág/AvPág)">Altura
        <select id="levelSel"><option value="all">todas</option><option value="0">0 suelo</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></label>
      <label class="chk"><input type="checkbox" id="chkLabels" checked> Etiquetas</label>
      <label class="chk"><input type="checkbox" id="chkLinks"> Conexiones</label>
      <span id="toolHint" class="muted small"></span>
    </div>
    <div id="canvasWrap">
      <canvas id="canvas"></canvas>
      <div id="dropHint" class="hidden">Suelta aquí un archivo de blueprint</div>
    </div>
    <footer id="status"><span id="stCursor"></span><span id="stInfo"></span><span id="stMsg"></span></footer>
  </section>

  <aside id="right" class="panel">
    <div id="inspector"></div>
  </aside>
</main>

<dialog id="dlgPaste">
  <form method="dialog">
    <h3>Pegar código de blueprint</h3>
    <textarea id="pasteText" rows="10" placeholder='BLUEPRINT:0,10,...'></textarea>
    <div class="row end">
      <button value="cancel">Cancelar</button>
      <button id="btnPasteOk" value="ok" class="primary">Abrir</button>
    </div>
  </form>
</dialog>

<dialog id="dlgCode">
  <form method="dialog">
    <h3>Código del blueprint</h3>
    <p class="muted small">Copia este texto y pégalo en el juego (modo planos → pegar).</p>
    <textarea id="codeText" rows="10" readonly></textarea>
    <div class="row end"><button value="ok" class="primary">Cerrar</button></div>
  </form>
</dialog>

<input type="file" id="fileInput" accept=".txt" hidden>
<input type="file" id="dirInput" webkitdirectory hidden>

<div id="toast"></div>

<script src="js/codec.js"></script>
<script src="js/recipes.js"></script>
<script src="js/items.js"></script>
<script src="js/templates.js"></script>
<script src="js/geometry.js"></script>
<script src="js/sprites.js"></script>
<script src="js/collision.js"></script>
<script src="js/app.js"></script>
</body>
</html>
